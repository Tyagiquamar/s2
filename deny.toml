[graph]
all-features = true

[advisories]
ignore = [
    # Transitive deps via slatedb/foyer — not actionable.
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2025-0141", # bincode unmaintained
    "RUSTSEC-2024-0449", # unsafe-libyaml via SlateDB/figment; YAML-file config unused

    # Transitive deps via keyring (Linux secret-service store in s2-cli) — no maintained alternative.
    "RUSTSEC-2026-0370", # zvariant unmaintained
    "RUSTSEC-2026-0371", # zbus_names unmaintained
    "RUSTSEC-2026-0372", # zvariant_derive unmaintained

    # Temporary risk acceptance while rustls-webpki 0.103.16 and webpki-root-certs 1.0.10
    # complete the 7-day cooldown.
    # TODO(2026-10-27): upgrade both and remove these two ignores.
    # This date is a manual deadline, not an automatically enforced expiry.
    { id = "RUSTSEC-2026-0382", reason = "Until 2026-10-27: rustls-webpki 0.103.16 cooldown." },
    { id = "RUSTSEC-2026-0383", reason = "Until 2026-10-27: webpki-root-certs 1.0.10 cooldown." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
deny = [
    { crate = "openssl", use-instead = "rustls-tls" },
    { crate = "openssl-sys", use-instead = "rustls-tls" },
    # TODO { crate = "ring", use-instead = "aws-lc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/slatedb/slatedb",
    "https://github.com/infiniteregrets/utoipa",
]
